version: 2.1

jobs:
  run-postman-tests:
    docker:
      # Используем официальный Docker-образ Newman на базе Alpine Linux (работает очень быстро)
      - image: postman/newman:6.1.3-alpine

    steps:
      # Клонируем репозиторий с вашими JSON-файлами
      - checkout

      # Создаем папку для отчетов, чтобы CircleCI мог их проанализировать
      - run:
          name: Create directory for test results
          command: mkdir -p test-results/newman

      # Запускаем тесты Postman с генерацией консольного и JUnit (XML) отчетов
      # Кавычки обязательны, так как в названиях файлов есть пробелы
      - run:
          name: Run Postman Collection via Newman
          command: |
            newman run Collection_for_Lesson5_newman.postman_collection.json \
            -e "ClickUp Environment.postman_environment.json" \
            --reporters cli,junit \
            --reporter-junit-export test-results/newman/results.xml

      # Сохраняем результаты тестов, чтобы они красиво отображались во вкладке "Tests" в CircleCI
      - store_test_results:
          path: test-results

      # Сохраняем XML-отчет в артефакты (можно будет скачать при необходимости)
      - store_artifacts:
          path: test-results
          destination: PostmanReports

workflows:
  api-testing-workflow:
    jobs:
      - run-postman-tests
